<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<head>
    <meta charset="UTF-8">
    <title>SuperLibro | Usuarios</title>
</head>

<body>
<div layout:fragment="content" class="container py-5">
    <h2 class="text-center mb-4"><i class="bi bi-people"></i> Lista de Usuarios</h2>

    <div class="mb-4 text-end">
        <a th:href="@{/usuario/nuevo}" class="btn btn-success">
            <i class="bi bi-plus-circle"></i> Registrar Usuario
        </a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>DNI</th>
                <th>Correo</th>
                <th>Rol</th>
                <th>Membresía</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(usuarios)}">
                <td colspan="7" class="text-center">No hay usuarios registrados.</td>
            </tr>
            <tr th:each="usuario : ${usuarios}">
                <td th:text="${usuario.nombre}"></td>
                <td th:text="${usuario.apellido}"></td>
                <td th:text="${usuario.dni}"></td>
                <td th:text="${usuario.correo}"></td>
                <td th:text="${usuario.rol.nombreRol}"></td>
                <td th:text="${usuario.membresia.nombreMembresia}"></td>
                <td>
                    <a th:href="@{/usuario/editar/{id}(id=${usuario.id})}" class="btn btn-sm btn-outline-warning" title="Editar">
                        <i class="bi bi-pencil"></i>
                    </a>
                    <form th:action="@{/usuario/eliminar/{id}(id=${usuario.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                onclick="return confirm('¿Está seguro de eliminar este usuario?');">
                            <i class="bi bi-trash"></i>
                        </button>
                    </form>

                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <a th:href="@{/}" class="btn btn-primary mt-3">Volver al inicio</a>
</div>
</body>
</html>
