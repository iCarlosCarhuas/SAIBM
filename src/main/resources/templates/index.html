<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <meta charset="UTF-8">
    <title>SAIBM | Inicio</title>
</head>
<body>
<div layout:fragment="content">

    <div class="container py-5" style="max-width: 500px;">
        <h2 class="text-center mb-4">Iniciar Sesión</h2>

        <form th:action="@{/security/login}" method="post">
            <div class="mb-3">
                <label for="email">Correo electrónico</label>
                <input id="email" type="email" name="email" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="contraseña">Contraseña</label>
                <input id="contraseña" type="password" name="contraseña" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Ingresar</button>
        </form>

        <p class="mt-3 text-center">
            ¿No tienes cuenta?
            <a th:href="@{/security/registro}">Regístrate aquí</a>
        </p>

        <div th:if="${error}" class="alert alert-danger mt-3 text-center" th:text="${error}"></div>
    </div>

</div>
</body>
</html>
