<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <meta charset="UTF-8">
    <title>Inicio de Sesión</title>
</head>

<body>
<div layout:fragment="content" class="row">
    <div class="col"></div>
    <div style="width: 500px">
        <div class="card mt-5">
            <div class="card-body">
                <form th:action="@{/security/login}" method="post" id="formAutenticar">
                    <div class="mb-3">
                        <label for="email" class="form-label">Correo Electrónico</label>
                        <input type="email" class="form-control" id="email" name="email" th:value="${email}" required/>
                    </div>
                    <div class="mb-3">
                        <label for="contraseña" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="contraseña" name="contraseña" required/>
                    </div>
                    <button type="submit" class="btn btn-primary">Ingresar</button>
                </form>

                <div class="mt-3">
                    ¿No tienes cuenta? <a th:href="@{/security/register}">Regístrate aquí</a>
                </div>
            </div>
        </div>

        <!-- Mostrar error si existe -->
        <div th:if="${error}" class="alert alert-danger mt-3" th:text="${error}"></div>
    </div>
    <div class="col"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>

<script type="text/javascript">
    $(() => {
        $('#formAutenticar').validate({
            rules: {
                email: {
                    required: true,
                    email: true
                },
                password: {
                    required: true
                }
            },
            messages: {
                email: {
                    required: 'El campo correo electrónico es requerido',
                    email: 'No es un correo válido'
                },
                password: {
                    required: 'El campo contraseña es requerido'
                }
            }
        });
    });
</script>
</body>
</html>
