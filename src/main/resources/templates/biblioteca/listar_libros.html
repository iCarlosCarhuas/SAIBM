<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<head>
    <meta charset="UTF-8">
    <title layout:fragment="contentTitle">SuperLibro | Libros</title>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>

<body>
<main layout:fragment="content">
    <div class="container py-5">
        <h2 class="text-center mb-4"><i class="bi bi-book"></i> Lista de Libros</h2>

        <div th:if="${error}" class="alert alert-danger text-center" th:text="${error}"></div>

        <div>
            <form th:action="@{/biblioteca/listar_libros}" method="get">
            <input type="text" name="nombre" class="form-control" placeholder="Buscar libro...">
                <button type="submit" class="btn btn-primary">Buscar</button>
            </form>
        </div>


        <div th:if="${usuario != null and usuario.rol != null and usuario.rol.nombreRol == 'ROLE_ADMIN'}">
        <a th:href="@{/biblioteca/nuevo}" class="btn btn-success">
                <i class="bi bi-plus-circle"></i> Crear Libro
            </a>
        </div>

        <div class="row row-cols-1 row-cols-md-3 g-4">
            <div th:if="${libros != null and libros.empty}">
                <div class="alert alert-info text-center w-100">No hay libros disponibles por el momento.</div>
                <a th:href="@{/biblioteca/listar_libros}" class="btn btn-primary mt-3">
                     Regresar
                </a>
            </div>
           <!-- <div th:if="${error}" class="alert alert-danger text-center" th:text="${error}"></div> por card-->
            <div th:each="libro : ${libros}" class="col">
                <div class="card h-100 border-primary shadow">
                    <div class="ratio ratio-1x1">
                        <img th:src="${libro.imagen}" class="card-img-top img-fluid object-fit-contain" alt="Imagen de libro">
                    </div>
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title" th:text="${libro.nombreLibro}"></h5>
                        <h6 class="text-muted">Autor: <span th:text="${libro.autor}"></span></h6>
                        <p class="card-text" th:text="${libro.descripcion}"></p>
                    </div>

                    <div class="card-footer d-flex justify-content-between align-items-center bg-light">
                        <span th:if="${libro.stock > 0}" class="badge bg-primary">Stock: <span th:text="${libro.stock}"></span></span>
                        <span th:unless="${libro.stock > 0}" class="badge bg-danger">Sin stock</span>

                        <div>
                            <!-- Opciones para ADMIN -->
                            <div th:if="${usuario != null and usuario.rol != null and usuario.rol.nombreRol == 'ROLE_ADMIN'}">
                                <a th:href="@{/biblioteca/editar/{id}(id=${libro.id})}" class="btn btn-sm btn-outline-warning" title="Editar">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/biblioteca/eliminar/{id}(id=${libro.id})}" method="post" style="display:inline;">
                                    <input type="hidden" name="id" th:value="${libro.id}" />
                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar"
                                            onclick="return confirm('¿Desea eliminar el registro?');">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>

                            <!-- Opciones para CLIENTE -->
                            <div th:if="${usuario != null and usuario.rol != null and usuario.rol.nombreRol != 'ROLE_ADMIN'}">
                                <form th:action="@{/reserva/{accion}(accion=${librosReservados.contains(libro.id) ? 'cancelar' : 'agregar'})}" method="post">
                                    <input type="hidden" name="libroId" th:value="${libro.id}" />

                                    <!-- Botón normal si no está confirmada -->
                                    <button type="submit"
                                            th:if="${not #lists.contains(reservasConfirmadas, libro.id)}"
                                            th:classappend="${librosReservados.contains(libro.id) ? 'btn-outline-danger' : 'btn-outline-success'}"
                                            th:title="${librosReservados.contains(libro.id) ? 'Cancelar reserva' : 'Reservar'}">
                                        <i th:classappend="${librosReservados.contains(libro.id) ? 'bi-journal-x' : 'bi-journal-plus'}"></i>
                                        <span th:text="${librosReservados.contains(libro.id) ? 'Cancelar' : 'Reservar'}"></span>
                                    </button>

                                    <!-- Botón deshabilitado si está confirmada -->
                                    <button type="button" class="btn btn-secondary" disabled
                                            th:if="${#lists.contains(reservasConfirmadas, libro.id)}">
                                        Confirmada
                                    </button>
                                </form>
                            </div>

                        </div>
                    </div>

                </div>
        </div>
            <!-- Botón para generar PDF de todos los libros -->
            <div class="text-end mt-4" th:if="${usuario != null and usuario.rol != null and usuario.rol.nombreRol == 'ROLE_ADMIN'}">
                <a th:href="@{/generar/reporteLibros}"
                   class="btn btn-primary">
                    <i class="bi bi-file-earmark-pdf"></i> Generar PDF de todos los libros
                </a>
            </div>

        <div th:if="${carritoReservas.size() > 0}" class="mt-4 text-end">
            <form th:action="@{/reserva/confirmar}" method="post">
                <div class="g-recaptcha" th:attr="data-sitekey=${recaptchaSiteKey}"></div>
                <button type="submit" class="btn btn-primary mt-2">
                    Confirmar Reserva(s) (<span th:text="${carritoReservas.size()}">0</span>)
                </button>
            </form>
        </div>
    </div>
    </div>
</main>
</body>
</html>
