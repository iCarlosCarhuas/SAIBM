server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: catalog-service
  datasource:
    url: ${SAIBM_CATALOG_DB_URL:jdbc:postgresql://localhost:5432/${SAIBM_CATALOG_DB_NAME:saibm_catalog}}
    username: ${SAIBM_CATALOG_DB_USER:}
    password: ${SAIBM_CATALOG_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

catalog:
  backfill:
    enabled: ${SAIBM_CATALOG_BACKFILL_ENABLED:false}

legacy:
  datasource:
    url: ${SAIBM_LEGACY_DB_URL:}
    username: ${SAIBM_LEGACY_DB_USER:}
    password: ${SAIBM_LEGACY_DB_PASSWORD:}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
