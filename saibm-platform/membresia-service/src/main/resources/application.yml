server:
  port: ${SERVER_PORT:8087}
spring:
  application:
    name: membresia-service
  datasource:
    url: ${SAIBM_MEMBRESIA_DB_URL:jdbc:postgresql://localhost:5432/${SAIBM_MEMBRESIA_DB_NAME:saibm_membresia}}
    username: ${SAIBM_MEMBRESIA_DB_USER:}
    password: ${SAIBM_MEMBRESIA_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${SAIBM_RABBITMQ_HOST:localhost}
    port: ${SAIBM_RABBITMQ_PORT:5672}
    username: ${SAIBM_RABBITMQ_USER:}
    password: ${SAIBM_RABBITMQ_PASSWORD:}
    virtual-host: ${SAIBM_RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
  mvc:
    problemdetails:
      enabled: true
membresia:
  backfill:
    enabled: ${SAIBM_MEMBRESIA_BACKFILL_ENABLED:false}
  security:
    transitional-secret: ${SAIBM_MEMBRESIA_INTERNAL_ADMIN_SECRET:}
  outbox:
    delay-ms: ${SAIBM_MEMBRESIA_OUTBOX_DELAY_MS:500}
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
