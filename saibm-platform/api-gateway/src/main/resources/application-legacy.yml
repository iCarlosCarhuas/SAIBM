spring:
  config:
    activate:
      on-profile: legacy
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: libro-books
              uri: lb://libro-service
              predicates:
                - Path=/api/v1/books,/api/v1/books/**
                - Method=GET
            - id: membresia-plans
              uri: lb://membresia-service
              predicates:
                - Path=/api/v1/memberships/plans,/api/v1/memberships/plans/*
                - Method=GET
            - id: legacy
              uri: ${SAIBM_LEGACY_BASE_URL}
              predicates:
                - Path=/legacy/**
              filters:
                - StripPrefix=1
